```
steps:
  - name: Checkout
    uses: actions/checkout@v6

  - name: Generate activity graph
    uses: maurodesouza/github-readme-activity-graph-action@v1
    with:
      username: ${{ github.repository_owner }}
      options: bg_color=0B0F14&color=7DD3FC&line=38BDF8&point=FFFFFF&area=true&hide_border=true&custom_title=GitHub%20Activity
      output_path: profile/activity.svg
      token: ${{ secrets.GITHUB_TOKEN }}

  - name: Commit activity graph
    run: |
      git config user.name "github-actions[bot]"
      git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      git add profile/activity.svg

      if git diff --cached --quiet; then
        echo "No activity changes."
        exit 0
      fi

      git commit -m "chore: update activity graph"
      git push