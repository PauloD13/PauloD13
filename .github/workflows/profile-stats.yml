name: Test Profile Workflow

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Testando GitHub Actions
        run: |
          echo "GitHub Actions funcionando!"
          echo "Repository: ${{ github.repository }}"
          echo "Branch: ${{ github.ref }}"
          echo "Evento: ${{ github.event_name }}"