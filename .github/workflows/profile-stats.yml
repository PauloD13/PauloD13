name: Update Profile Stats

on:
  push:
    branches:
      - main

  schedule:
    - cron: "0 0 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Generate stats
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&include_all_commits=true&rank_icon=github&hide_border=true&bg_color=0B0F14&title_color=7DD3FC&text_color=CBD5E1&icon_color=38BDF8
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate top languages
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=8&hide_border=true&bg_color=0B0F14&title_color=7DD3FC&text_color=CBD5E1
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate WebAppliSocialViolenceGame
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=${{ github.repository_owner }}&repo=WebAppliSocialViolenceGame&hide_border=true&bg_color=0B0F14&title_color=7DD3FC&text_color=CBD5E1&icon_color=38BDF8
          path: profile/project-web.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate LachoneteSystem
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=${{ github.repository_owner }}&repo=LachoneteSystem&hide_border=true&bg_color=0B0F14&title_color=7DD3FC&text_color=CBD5E1&icon_color=38BDF8
          path: profile/project-lanchonete.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate JavaAulas
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=${{ github.repository_owner }}&repo=JavaAulas&hide_border=true&bg_color=0B0F14&title_color=7DD3FC&text_color=CBD5E1&icon_color=38BDF8
          path: profile/project-java.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit generated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "chore: update profile stats" || exit 0
          git push