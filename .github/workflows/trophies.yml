name: Update GitHub Trophies

on:
  push:
    branches:
      - main

  schedule:
    - cron: "0 9 * * *"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-trophies
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate trophies
        uses: soulteary/github-profile-trophy-action@v1.0.0
        with:
          options: "username=${{ github.repository_owner }}&theme=darkhub&no-frame=true&no-bg=true&margin-w=8&column=6"
          path: profile/trophies.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit trophies
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/trophies.svg
          git commit -m "chore: update trophies" || exit 0
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push; then
              exit 0
            fi
            git rebase --abort || true
            sleep $((attempt * 2))
          done
          echo "Unable to push trophy update after 5 attempts" >&2
          exit 1