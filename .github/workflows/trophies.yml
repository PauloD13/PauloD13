name: Update GitHub Trophies

on:
schedule:
- cron: "0 9 * * *"

workflow_dispatch:

permissions:
contents: write

jobs:
build:
runs-on: ubuntu-latest

steps:
  - name: Checkout
    uses: actions/checkout@v6

  - name: Generate trophies
    uses: soulteary/github-profile-trophy-action@v1.0.0
    with:
      options: username=${{ github.repository_owner }}&theme=darkhub&no-frame=true&no-bg=true&margin-w=8&row=1&column=6
      path: profile/trophies.svg
      token: ${{ secrets.GITHUB_TOKEN }}

  - name: Commit trophies
    run: |
      git config user.name "github-actions[bot]"
      git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      git add profile/trophies.svg

      if git diff --cached --quiet; then
        echo "No trophy changes."
        exit 0
      fi

      git commit -m "chore: update GitHub trophies"
      git push