name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Generate contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%23FFFFFF&color_dots=%230B0F14,%231E3A5F,%2338BDF8,%238B5CF6,%23C084FC
            dist/github-contribution-grid-snake-dark.svg?color_snake=%23FFFFFF&color_dots=%230B0F14,%231E3A5F,%2338BDF8,%238B5CF6,%23C084FC

      - name: Publish snake
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}