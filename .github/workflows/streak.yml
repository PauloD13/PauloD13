name: Update GitHub Streak

on:
schedule:
- cron: "0 3 * * *"

workflow_dispatch:

permissions:
contents: write

jobs:
build:
runs-on: ubuntu-latest

steps:
  - name: Checkout
    uses: actions/checkout@v6

  - name: Generate streak stats
    uses: DenverCoder1/github-readme-streak-stats@main
    with:
      options: user=${{ github.repository_owner }}&background=0B0F14&ring=38BDF8&fire=7DD3FC&currStreakLabel=7DD3FC&sideLabels=CBD5E1&currStreakNum=FFFFFF&sideNums=FFFFFF&dates=94A3B8&hide_border=true&disable_animations=true
      path: profile/streak.svg
      token: ${{ secrets.GITHUB_TOKEN }}

  - name: Commit streak stats
    run: |
      git config user.name "github-actions[bot]"
      git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      git add profile/streak.svg

      if git diff --cached --quiet; then
        echo "No streak changes."
        exit 0
      fi

      git commit -m "chore: update GitHub streak"
      git push
